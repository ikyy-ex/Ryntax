<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --line: #dfe2e8; --ink: #17202e; --muted: #5d6879;
    --accent: #2f4bff; --accent-ink: #ffffff; --accent-soft: #e8ebff; --field: #f9fafb;
  }
  html.dark {
    --bg: #0f141b; --surface: #171e28; --line: #2a3442; --ink: #e8edf5; --muted: #94a0b3;
    --accent: #7f93ff; --accent-ink: #0d1230; --accent-soft: #212a52; --field: #121820;
  }
  html { color-scheme: light; }
  html.dark { color-scheme: dark; }
  body { background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .surface { background: var(--surface); border: 1px solid var(--line); }
  .muted { color: var(--muted); }
  .field { background: var(--field); border: 1px solid var(--line); color: var(--ink); border-radius: .6rem; padding: .6rem .8rem; width: 100%; }
  .field:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn { background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: .6rem; padding: .5rem .9rem; font-weight: 600; font-size: .9rem; cursor: pointer; transition: background .15s, border-color .15s; }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible, .chip:focus-visible, .tool-card:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: .35rem .9rem; font-size: .875rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .icon-btn { background: var(--surface); border: 1px solid var(--line); border-radius: .6rem; width: 2.5rem; height: 2.5rem; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
  .icon-btn:hover { border-color: var(--accent); }
  .tool-card { text-align: left; cursor: pointer; border-radius: 1rem; padding: 1.1rem; transition: border-color .15s, transform .15s; }
  .tool-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .tool-icon { width: 2.6rem; height: 2.6rem; border-radius: .7rem; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; }
  .stat { background: var(--field); border: 1px solid var(--line); border-radius: .8rem; padding: .8rem 1rem; }
  .stat b { display: block; font-size: 1.6rem; line-height: 1.2; }
  .tabular { font-variant-numeric: tabular-nums; }
  input[type=range] { accent-color: var(--accent); width: 100%; }
  input[type=checkbox] { accent-color: var(--accent); width: 1.1rem; height: 1.1rem; }
  #toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%) translateY(1rem); background: var(--ink); color: var(--bg); padding: .6rem 1rem; border-radius: .6rem; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  /* ===== Tema Neo-Brutalist / Retro Card Grid ===== */
  :root { --bg:#FFFDF0; --surface:#ffffff; --line:#111111; --ink:#111111; --muted:#4a4a4a; --accent:#FF4FA3; --accent-ink:#111111; --accent-soft:#FFF3A8; --field:#ffffff; }
  html.dark { --bg:#1b1a14; --surface:#27261e; --line:#f5f0d0; --ink:#f5f0d0; --muted:#b9b49a; --accent:#FF6FB5; --accent-ink:#111111; --accent-soft:#3a3920; --field:#1b1a14; }
  .surface, .stat, .btn, .field, .chip, .icon-btn, .tool-card { border: 2.5px solid var(--line); box-shadow: 4px 4px 0 var(--line); }
  .stat, .field { box-shadow: 3px 3px 0 var(--line); }
  .field:focus { outline: 3px solid var(--accent); outline-offset: 0; }
  header.surface { box-shadow: none; background: var(--accent-soft); }
  .btn, .chip, .icon-btn { font-weight: 800; }
  .btn:hover, .chip:hover, .icon-btn:hover { border-color: var(--line); transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--line); }
  .btn:active, .chip:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--line); }
  .btn-primary { background: var(--accent); color: #111; border-color: var(--line); }
  .btn-primary:hover { filter: none; }
  .btn.active, .chip.active { background: var(--ink); color: var(--bg); border-color: var(--line); }
  .tool-card { border-radius: .6rem; padding: .85rem; color: #111; }
  .tool-card:hover { border-color: var(--line); transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--line); }
  .tool-card .muted { color: #2b2b2b; font-size: .8rem; }
  .tool-card .chip { background: #fff; color: #111; border-color: #111; box-shadow: none; font-size: .7rem; padding: .1rem .5rem; }
  .tool-card.c0 { background: #FFE14D; } .tool-card.c1 { background: #ffffff; } .tool-card.c2 { background: #FF8AD1; }
  .tool-card.c3 { background: #9ADBFF; } .tool-card.c4 { background: #A8F0C6; }
  .tool-icon { background: #fff; color: #111; border: 2.5px solid #111; border-radius: .5rem; }
  .badge { display: inline-block; background: #111; color: #FFE14D; border: 2px solid #111; font-weight: 900; font-size: .6rem; letter-spacing: .04em; padding: .05rem .4rem; margin-top: .3rem; }
  .badge-lg { display: inline-block; background: #111; color: #FFE14D; border: 2.5px solid #111; box-shadow: 4px 4px 0 #FF4FA3; font-weight: 900; letter-spacing: .05em; padding: .3rem .8rem; }
  html.dark .badge-lg { background: #FFE14D; color: #111; box-shadow: 4px 4px 0 #f5f0d0; }
  #toast { border: 2.5px solid var(--line); }
  body { background-image: radial-gradient(rgba(17,17,17,.13) 1.2px, transparent 1.2px); background-size: 18px 18px; }
  html.dark body { background-image: radial-gradient(rgba(245,240,208,.1) 1.2px, transparent 1.2px); }
  .tool-card { position: relative; }
  .fav { position: absolute; top: .45rem; right: .45rem; width: 2rem; height: 2rem; background: #fff; color: #111; border: 2px solid #111; font-size: 1.1rem; line-height: 1; cursor: pointer; }
  .fav:hover { background: #FFE14D; }
  #auth-pop { position: absolute; right: 0; top: calc(100% + .6rem); width: 17rem; z-index: 60; padding: 1rem; background: var(--surface); }
  body { overflow-x: hidden; }
  pre { overflow-x: auto; }
  textarea.field { resize: vertical; }
  .stat, .tool-card h3 { overflow-wrap: anywhere; }
  .btn.copied { background: #A8F0C6; color: #111; border-color: #111; }
  #toast { max-width: 90vw; text-align: center; }
  @media (max-width: 480px) {
    #logo .badge { display: none; }
    .field { font-size: 16px; }
    .btn { min-height: 2.5rem; }
    #tool-root { padding: .9rem; }
    .tool-card { padding: .7rem; }
    .stat b { font-size: 1.3rem; }
  }
</style>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   BAGIAN 1 — UTILITAS BERSAMA
   ===================================================================== */
const Util = {
  $(sel, root) { return (root || document).querySelector(sel); },
  $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); },
  fmt(n, max) {
    if (!isFinite(n)) return '–';
    return new Intl.NumberFormat('id-ID', { maximumFractionDigits: max === undefined ? 2 : max }).format(n);
  },
  toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(Util._tt);
    Util._tt = setTimeout(() => t.classList.remove('show'), 1800);
  },
  async copy(text) {
    if (!text) { Util.toast('Tidak ada teks untuk disalin'); return false; }
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (err) { Util.toast('Gagal menyalin'); document.body.removeChild(ta); return false; }
      document.body.removeChild(ta);
    }
    Util.toast('Tersalin ke clipboard');
    Util.flash();
    return true;
  },
  icon(paths) {
    return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
  }
};

/* =====================================================================
   BAGIAN 2 — REGISTRI TOOL
   Untuk menambah tool baru: panggil registerTool({...}) satu kali.
   Setiap tool berisi:
     id          : string unik (huruf kecil, tanpa spasi)
     name        : nama yang tampil
     category    : 'Text' | 'Generators' | 'Calculators' (atau kategori baru, otomatis muncul)
     description : penjelasan singkat
     keywords    : kata kunci tambahan untuk pencarian
     icon        : isi SVG (path) ukuran 24x24
     mount(root) : fungsi yang mengisi elemen root dengan antarmuka tool
   ===================================================================== */
const TOOLS = [];
function registerTool(tool) {
  if (TOOLS.some(t => t.id === tool.id)) { console.warn('Tool dengan id sudah ada: ' + tool.id); return; }
  TOOLS.push(tool);
}

/* ---------- Tool 1: Word & Character Counter ---------- */
registerTool({
  id: 'word-counter',
  name: 'Word & Character Counter',
  category: 'Text',
  description: 'Hitung kata, karakter, baris, dan estimasi waktu baca.',
  keywords: 'hitung kata karakter baris waktu baca counter',
  icon: '<path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M9 19h6"/>',
  mount(root) {
    root.innerHTML = `
      <label for="wc-text" class="block text-sm font-semibold mb-2">Tempel atau ketik teks Anda</label>
      <textarea id="wc-text" class="field" rows="9" placeholder="Mulai mengetik di sini..."></textarea>
      <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 mt-4">
        <div class="stat"><span class="muted text-sm">Kata</span><b id="wc-words" class="tabular">0</b></div>
        <div class="stat"><span class="muted text-sm">Karakter (dengan spasi)</span><b id="wc-chars" class="tabular">0</b></div>
        <div class="stat"><span class="muted text-sm">Karakter (tanpa spasi)</span><b id="wc-nospace" class="tabular">0</b></div>
        <div class="stat"><span class="muted text-sm">Baris</span><b id="wc-lines" class="tabular">0</b></div>
        <div class="stat"><span class="muted text-sm">Kalimat</span><b id="wc-sent" class="tabular">0</b></div>
        <div class="stat"><span class="muted text-sm">Estimasi waktu baca</span><b id="wc-read" class="tabular">0 dtk</b></div>
      </div>
      <p class="muted text-xs mt-3">Estimasi waktu baca dihitung dengan kecepatan 200 kata per menit.</p>
      <div class="mt-4"><button id="wc-clear" type="button" class="btn">Hapus teks</button></div>`;
    const $ = s => Util.$(s, root);
    const area = $('#wc-text');
    function update() {
      const text = area.value;
      const words = (text.match(/\S+/g) || []).length;
      const chars = text.length;
      const nospace = text.replace(/\s/g, '').length;
      const lines = text.length ? text.split(/\r\n|\r|\n/).length : 0;
      const sentences = (text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || []).filter(s => /\S/.test(s)).length;
      const seconds = Math.ceil((words / 200) * 60);
      let read;
      if (words === 0) read = '0 dtk';
      else if (seconds < 60) read = seconds + ' dtk';
      else { const m = Math.floor(seconds / 60), s = seconds % 60; read = m + ' mnt' + (s ? ' ' + s + ' dtk' : ''); }
      $('#wc-words').textContent = Util.fmt(words, 0);
      $('#wc-chars').textContent = Util.fmt(chars, 0);
      $('#wc-nospace').textContent = Util.fmt(nospace, 0);
      $('#wc-lines').textContent = Util.fmt(lines, 0);
      $('#wc-sent').textContent = Util.fmt(sentences, 0);
      $('#wc-read').textContent = read;
    }
    area.addEventListener('input', update);
    $('#wc-clear').addEventListener('click', () => { area.value = ''; update(); area.focus(); });
    update();
  }
});

/* ---------- Tool 2: Password Generator ---------- */
registerTool({
  id: 'password-generator',
  badge: 'DISEMATKAN',
  name: 'Password Gen',
  category: 'Generators',
  description: 'Buat password acak yang kuat dengan opsi yang bisa diatur.',
  keywords: 'sandi kata sandi acak random aman generator',
  icon: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  mount(root) {
    root.innerHTML = `
      <div class="flex gap-2">
        <input id="pw-out" class="field tabular" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.05rem" type="text" readonly aria-label="Password hasil">
        <button id="pw-copy" type="button" class="btn btn-primary">Salin</button>
      </div>
      <div class="mt-3" aria-live="polite">
        <div class="h-2 rounded-full overflow-hidden" style="background:var(--line)"><div id="pw-bar" class="h-full" style="width:0;transition:width .2s"></div></div>
        <p class="text-sm mt-1">Kekuatan: <b id="pw-strength">–</b></p>
      </div>
      <div class="mt-5">
        <label for="pw-len" class="flex justify-between text-sm font-semibold mb-2"><span>Panjang password</span><span id="pw-len-val" class="tabular">16</span></label>
        <input id="pw-len" type="range" min="4" max="64" value="16">
      </div>
      <div class="grid sm:grid-cols-2 gap-3 mt-4 text-sm">
        <label class="stat flex items-center gap-3 cursor-pointer"><input id="pw-upper" type="checkbox" checked> Huruf besar (A–Z)</label>
        <label class="stat flex items-center gap-3 cursor-pointer"><input id="pw-lower" type="checkbox" checked> Huruf kecil (a–z)</label>
        <label class="stat flex items-center gap-3 cursor-pointer"><input id="pw-num" type="checkbox" checked> Angka (0–9)</label>
        <label class="stat flex items-center gap-3 cursor-pointer"><input id="pw-sym" type="checkbox" checked> Simbol (!@#$%...)</label>
      </div>
      <p id="pw-msg" class="text-sm mt-3" style="color:#d93a3a" role="alert"></p>
      <div class="mt-4"><button id="pw-gen" type="button" class="btn">Buat password baru</button></div>`;
    const $ = s => Util.$(s, root);
    const SETS = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower: 'abcdefghijklmnopqrstuvwxyz',
      num: '0123456789',
      sym: '!@#$%^&*()-_=+[]{};:,.<>?/~'
    };
    function randInt(max) {
      // Pengambilan acak tanpa bias menggunakan crypto API
      const limit = Math.floor(4294967296 / max) * max;
      const buf = new Uint32Array(1);
      do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % max;
    }
    function generate() {
      const len = parseInt($('#pw-len').value, 10);
      $('#pw-len-val').textContent = len;
      const active = [];
      if ($('#pw-upper').checked) active.push(SETS.upper);
      if ($('#pw-lower').checked) active.push(SETS.lower);
      if ($('#pw-num').checked) active.push(SETS.num);
      if ($('#pw-sym').checked) active.push(SETS.sym);
      if (!active.length) {
        $('#pw-out').value = '';
        $('#pw-msg').textContent = 'Pilih minimal satu jenis karakter.';
        $('#pw-bar').style.width = '0';
        $('#pw-strength').textContent = '–';
        return;
      }
      $('#pw-msg').textContent = '';
      const all = active.join('');
      const chars = [];
      // Pastikan setiap jenis yang dipilih muncul minimal satu kali
      active.forEach(set => chars.push(set[randInt(set.length)]));
      while (chars.length < len) chars.push(all[randInt(all.length)]);
      // Acak urutan (Fisher–Yates)
      for (let i = chars.length - 1; i > 0; i--) {
        const j = randInt(i + 1);
        const tmp = chars[i]; chars[i] = chars[j]; chars[j] = tmp;
      }
      const pw = chars.slice(0, len).join('');
      $('#pw-out').value = pw;
      const bits = Math.log2(all.length) * pw.length;
      let label, color, pct;
      if (bits < 40) { label = 'Lemah'; color = '#d93a3a'; pct = 25; }
      else if (bits < 60) { label = 'Cukup'; color = '#e0952b'; pct = 50; }
      else if (bits < 90) { label = 'Kuat'; color = '#3aa15c'; pct = 75; }
      else { label = 'Sangat kuat'; color = '#1f8a4c'; pct = 100; }
      $('#pw-bar').style.width = pct + '%';
      $('#pw-bar').style.background = color;
      $('#pw-strength').textContent = label + ' (±' + Math.round(bits) + ' bit)';
    }
    ['#pw-len', '#pw-upper', '#pw-lower', '#pw-num', '#pw-sym'].forEach(s => $(s).addEventListener('input', generate));
    $('#pw-gen').addEventListener('click', generate);
    $('#pw-copy').addEventListener('click', () => Util.copy($('#pw-out').value));
    generate();
  }
});

      discount: {
        fields: [['a', 'Harga asli', 'mis. 250000'], ['b', 'Diskon (%)', 'mis. 20']],
        calc(a, b) {

      },
      what: {
        fields: [['a', 'Angka (X)', 'mis. 45'], ['b', 'Dari total (Y)', 'mis. 300']],
        calc(a, b) {
          if (b === 0) return { error: 'Y tidak boleh nol.' };
          return { main: Util.fmt(a) + ' adalah ' + Util.fmt(a / b * 100) + '% dari ' + Util.fmt(b), sub: '' };
        }
      },
      change: {
        fields: [['a', 'Nilai awal', 'mis. 120'], ['b', 'Nilai akhir', 'mis. 150']],
        calc(a, b) {
          if (a === 0) return { error: 'Nilai awal tidak boleh nol.' };

          return { main: (pct >= 0 ? 'Naik ' : 'Turun ') + Util.fmt(Math.abs(pct)) + '%', sub: 'Selisih ' + Util.fmt(b - a) + ' dari ' + Util.fmt(a) + ' ke ' + Util.fmt(b) };

        </div>

    const $ = s => Util.$(s, root);
    const canvas = $('#qr-canvas');
    const buttons = ['#qr-download', '#qr-copy', '#qr-copytext'].map(s => $(s));
    function setReady(ready) {
      canvas.style.display = ready ? 'block' : 'none';
      $('#qr-empty').style.display = ready ? 'none' : 'block';
      buttons.forEach(b => { b.disabled = !ready; b.style.opacity = ready ? '1' : '.5'; b.style.cursor = ready ? 'pointer' : 'not-allowed'; });
    }
    function draw() {
      const text = $('#qr-text').value;
      $('#qr-msg').textContent = '';
      if (!text.trim()) { setReady(false); return; }
      if (typeof qrcode === 'undefined') {
        setReady(false);
        $('#qr-msg').textContent = 'Library QR code gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.';
        return;
      }
      try {
        qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
        const qr = qrcode(0, $('#qr-ec').value);
        qr.addData(text);
        qr.make();
        const n = qr.getModuleCount();
        const quiet = 4;
        const target = parseInt($('#qr-size').value, 10);
        const cell = Math.max(1, Math.floor(target / (n + quiet * 2)));
        const px = cell * (n + quiet * 2);
        canvas.width = px; canvas.height = px;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, px, px);
        ctx.fillStyle = '#000000';
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
          }
        }
        setReady(true);
      } catch (e) {
        setReady(false);
        $('#qr-msg').textContent = 'Teks terlalu panjang untuk dijadikan QR code. Persingkat teks atau turunkan tingkat koreksi kesalahan.';
      }
    }
    ['#qr-text', '#qr-size', '#qr-ec'].forEach(s => $(s).addEventListener('input', draw));
    $('#qr-download').addEventListener('click', () => {
      canvas.toBlob(blob => {
        if (!blob) { Util.toast('Gagal membuat file'); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'qrcode.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, 'image/png');
    });
    $('#qr-copy').addEventListener('click', () => {
      if (!navigator.clipboard || !window.ClipboardItem) { Util.toast('Browser belum mendukung salin gambar. Gunakan Unduh PNG.'); return; }
      canvas.toBlob(blob => {
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
          .then(() => Util.toast('Gambar QR tersalin'))
          .catch(() => Util.toast('Gagal menyalin gambar. Gunakan Unduh PNG.'));
      }, 'image/png');
    });
    $('#qr-copytext').addEventListener('click', () => Util.copy($('#qr-text').value));
    draw();
  }
});

        <button id="js-clear" type="button" class="btn">Hapus</button>
      </div>`;
    const $ = s => Util.$(s, root);
    function describe(src, e) {
      let line = null, col = null, m;
      if ((m = e.message.match(/line (\d+) column (\d+)/))) { line = +m[1]; col = +m[2]; }
      else if ((m = e.message.match(/position (\d+)/))) {
        const pos = parseInt(m[1], 10), before = src.slice(0, pos);
        line = before.split('\n').length; col = pos - before.lastIndexOf('\n');
      }
      return 'JSON tidak valid: ' + e.message + (line ? ' (baris ' + line + ', kolom ' + col + ')' : '');
    }
    function parse() {
      const src = $('#js-in').value;
      const status = $('#js-status');
      if (!src.trim()) { status.innerHTML = '<span class="muted">Tempel JSON untuk dicek.</span>'; return null; }
      try {
        const data = JSON.parse(src);
        const kind = Array.isArray(data) ? 'array (' + data.length + ' item)' : (data !== null && typeof data === 'object') ? 'objek (' + Object.keys(data).length + ' kunci)' : typeof data;
        status.innerHTML = '';
        const ok = document.createElement('span');
        ok.style.color = '#1f8a4c'; ok.style.fontWeight = '600';
        ok.textContent = 'JSON valid · ' + kind;
        status.appendChild(ok);
        return { data: data };
      } catch (e) {
        status.innerHTML = '';
        const bad = document.createElement('span');
        bad.style.color = '#d93a3a';
        bad.textContent = describe(src, e);
        status.appendChild(bad);
        return null;
      }
    }
    function indentValue() { const v = $('#js-indent').value; return v === 'tab' ? '\t' : parseInt(v, 10); }
    $('#js-in').addEventListener('input', parse);
    $('#js-format').addEventListener('click', () => {
      const r = parse();
      if (r) $('#js-in').value = JSON.stringify(r.data, null, indentValue());
    });
    $('#js-minify').addEventListener('click', () => {
      const r = parse();
      if (r) $('#js-in').value = JSON.stringify(r.data);
    });
    $('#js-copy').addEventListener('click', () => Util.copy($('#js-in').value));
    $('#js-clear').addEventListener('click', () => { $('#js-in').value = ''; parse(); $('#js-in').focus(); });
  }
});

      const h = parseFloat(hRaw), w = parseFloat(wRaw);

        out.innerHTML = '<span style="color:#d93a3a">Masukkan tinggi 50–260 cm dan berat 10–500 kg.</span>';
        return;
      }
      const m = h / 100;
      const bmi = w / (m * m);
      const cat = category(bmi);
      const lo = 18.5 * m * m, hi = 24.9 * m * m;
      out.innerHTML = '';
      const big = document.createElement('b');
      big.className = 'tabular'; big.style.fontSize = '1.8rem';

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function wrapText(ctx, text, maxW) {
  const lines = [];
  text.split('\n').forEach(p => { let line = ''; p.split(' ').forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }); lines.push(line); });

}

/* ---------- Pabrik tool layanan (endpoint eksternal) ----------
   Isi URL backend milik Anda pada ENDPOINTS. Kontrak yang diharapkan:
   POST {endpoint}  body JSON berisi nilai kolom  →  balasan {"status":"ok","title":"...","download_url":"https://..."} */
const ENDPOINTS = { tiktok: '', instagram: '', youtube: '', nokos: '', tts: '', foto: '/.netlify/functions/upload', file: '/.netlify/functions/upload', proxy: '/.netlify/functions/proxy?url=', rembg: '/.netlify/functions/rembg', resep: '', clips: '', deploy: '/.netlify/functions/deploy', preset: '', bilibili: '', pinterest: '', npsn: '', drama: '', wacheck: '' };
function serviceTool(c) {
  registerTool({
    id: c.id, name: c.name, category: 'Downloader', badge: c.badge, description: c.description, keywords: c.keywords, icon: c.icon,
    mount(root) {
      root.innerHTML = fieldGrid(c.fields, 'sv-') + '<div class="mt-4"><button id="sv-go" class="btn btn-primary" type="button">' + c.action + '</button></div><p id="sv-status" class="text-sm mt-3 font-semibold" aria-live="polite"></p><h3 class="font-extrabold mt-5 mb-2">Riwayat</h3><ul id="sv-hist" class="grid gap-2"></ul><details class="mt-4 text-sm"><summary class="font-semibold cursor-pointer">Cara menghubungkan endpoint</summary><pre class="stat mt-2 text-xs" style="white-space:pre-wrap">Isi ENDPOINTS.' + c.key + ' di kode dengan URL backend Anda.\nRequest : POST JSON berisi nilai kolom di atas\nBalasan : {"status":"ok","title":"...","download_url":"https://..."}\nBackend perlu mengizinkan CORS dari domain situs ini.\nGunakan hanya untuk konten milik Anda atau yang diizinkan pemiliknya.</pre></details>';
      const $ = s => Util.$(s, root), KEY = 'alltools-hist-' + c.id; let hist = [];
      try { hist = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { hist = []; }
      const save = () => { try { localStorage.setItem(KEY, JSON.stringify(hist.slice(0, 15))); } catch (e) { /* abaikan */ } };
      function render() {
        $('#sv-hist').innerHTML = hist.length ? hist.slice(0, 15).map(h => '<li class="stat text-sm"><b class="block break-all">' + esc(h.label) + '</b><span class="muted">' + esc(h.time) + ' · ' + esc(h.status) + '</span>' + (h.link ? ' <a class="underline font-bold" href="' + esc(h.link) + '" target="_blank" rel="noopener noreferrer">Buka hasil</a>' : '') + '</li>').join('') : '<li class="muted text-sm">Belum ada riwayat.</li>';
      }
      function log(label, status, link) { hist.unshift({ label: label, status: status, link: link || '', time: new Date().toLocaleString('id-ID') }); save(); render(); }
      $('#sv-go').addEventListener('click', async () => {
        const v = {}; c.fields.forEach(f => { v[f.id] = $('#sv-' + f.id).value.trim(); });
        const err = c.validate ? c.validate(v) : ''; const st = $('#sv-status');
        if (err) { st.style.color = '#d93a3a'; st.textContent = err; return; }
        const label = c.label(v), ep = ENDPOINTS[c.key];
        if (!ep) { st.style.color = '#b86b00'; st.textContent = 'Endpoint belum diatur (mode placeholder). Isi ENDPOINTS.' + c.key + ' di kode.'; log(label, 'Menunggu endpoint'); return; }
        st.style.color = 'inherit'; st.textContent = 'Memproses...';
        try {
          const r = await fetch(ep, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(v) }); const d = await r.json();
          if (!r.ok || d.status === 'error') throw new Error(d.message || 'Gagal');
          st.style.color = '#1f8a4c'; st.textContent = 'Selesai' + (d.title ? ': ' + d.title : ''); log(label, 'Selesai', /^https?:\/\//.test(d.download_url || '') ? d.download_url : '');
        } catch (e) { st.style.color = '#d93a3a'; st.textContent = 'Gagal memproses. Periksa endpoint dan CORS.'; log(label, 'Gagal'); }
      });
      render();
    }
  });
}

/* ---------- Pabrik tool pencarian (hasil berupa kartu) ----------
   Kontrak endpoint: GET {endpoint}?q=kata  →  [{"title","desc","thumb","url"}] atau {"results":[...]} */
function searchTool(c) {
  registerTool({
    id: c.id, name: c.name, category: 'Media', badge: c.badge, description: c.description, keywords: c.keywords, icon: c.icon,
    mount(root) {
      root.innerHTML = '<div class="flex gap-2"><input id="sr-q" class="field" placeholder="' + c.ph + '" autocomplete="off"><button id="sr-go" class="btn btn-primary" type="button">Cari</button></div><div id="sr-h" class="flex flex-wrap gap-2 mt-3"></div><p id="sr-st" class="text-sm mt-3 font-semibold" aria-live="polite"></p><div id="sr-out" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-3"></div><details class="mt-4 text-sm"><summary class="font-semibold cursor-pointer">Cara menghubungkan endpoint</summary><pre class="stat mt-2 text-xs" style="white-space:pre-wrap">Isi ENDPOINTS.' + c.key + ' dengan URL backend/scraper milik Anda.\nRequest : GET {endpoint}?q=kata_kunci\nBalasan : [{"title":"...","desc":"...","thumb":"https://...","url":"https://..."}]\nBackend harus mengizinkan CORS. Patuhi aturan layanan sumber dan hak cipta.</pre></details>';
      const $ = s => Util.$(s, root), HK = 'alltools-sr-' + c.id; let hist = store.get(HK, []);
      const COLS = ['#FFE14D', '#FF8AD1', '#9ADBFF', '#A8F0C6', '#ffffff'];
      function drawHist() { $('#sr-h').innerHTML = hist.map(h => '<button type="button" class="chip" data-h="' + esc(h) + '">' + esc(h) + '</button>').join(''); Util.$$('[data-h]', root).forEach(b => b.addEventListener('click', () => { $('#sr-q').value = b.dataset.h; run(); })); }
      function cards(items) {
        $('#sr-out').innerHTML = items.length ? items.map((it, i) => '<div class="stat" style="padding:.5rem">' + (/^https?:\/\//.test(it.thumb || '') ? '<img src="' + esc(it.thumb) + '" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:100%;aspect-ratio:4/3;object-fit:cover;border:2px solid #111">' : '<div style="aspect-ratio:4/3;background:' + COLS[i % 5] + ';border:2px solid #111;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#111">' + c.emoji + '</div>') + '<b class="block text-sm mt-2 leading-tight">' + esc(it.title || '-') + '</b>' + (it.desc ? '<span class="muted text-xs block">' + esc(it.desc) + '</span>' : '') + (it.ing ? '<details class="text-xs mt-1"><summary class="font-bold cursor-pointer">Bahan &amp; langkah</summary><b>Bahan:</b> ' + esc(it.ing.join(', ')) + '<ol class="list-decimal pl-4 mt-1">' + it.steps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol></details>' : '') + (/^https?:\/\//.test(it.url || '') ? '<a class="btn mt-2 inline-block" style="padding:.2rem .6rem" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">Buka</a>' : '') + '</div>').join('') : '';
      }
      async function run() {
        const q = $('#sr-q').value.trim(), st = $('#sr-st'), ep = ENDPOINTS[c.key];
        if (!q && !c.local) { setSt(st, 'Masukkan kata kunci.', '#d93a3a'); return; }
        if (q) { hist = [q].concat(hist.filter(h => h !== q)).slice(0, 8); store.set(HK, hist); drawHist(); }
        if (ep) {
          setSt(st, 'Mencari...');
          try { const r = await fetch(ep + (ep.includes('?') ? '&' : '?') + 'q=' + encodeURIComponent(q)); if (!r.ok) throw 0; const d = await r.json(), items = Array.isArray(d) ? d : (d.results || []); cards(items); setSt(st, items.length + ' hasil.', '#1f8a4c'); }
          catch (e) { cards([]); setSt(st, 'Gagal mengambil data. Periksa endpoint dan CORS.', '#d93a3a'); }
        } else if (c.local) { const items = c.local.filter(i => (i.title + ' ' + i.desc).toLowerCase().includes(q.toLowerCase())); cards(items); setSt(st, items.length + ' hasil (data lokal contoh)' + (c.key ? '. Isi ENDPOINTS.' + c.key + ' untuk data asli.' : ''), '#b86b00'); }
        else { cards([]); setSt(st, 'Endpoint belum diatur (mode placeholder). Isi ENDPOINTS.' + c.key + ' di kode.', '#b86b00'); }
      }
      $('#sr-go').addEventListener('click', run); $('#sr-q').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
      drawHist(); if (c.local) run();
    }
  });
}

    const rnd = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join(''); };
    async function inbox() {
      if (!tok) return;
      if (!root.isConnected) { clearInterval(timer); return; }
      try {
        const m = (await jf('/messages', {}, tok))['hydra:member'] || [];
        $('#tm-l').innerHTML = m.length ? '' : '<li class="muted text-sm">Inbox kosong. Menunggu pesan (cek otomatis tiap 10 detik)...</li>';
        m.forEach(x => { const li = document.createElement('li'); li.className = 'stat'; li.style.cursor = 'pointer'; const b = document.createElement('b'); b.textContent = x.subject || '(tanpa subjek)'; const s = document.createElement('span'); s.className = 'muted text-sm block'; s.textContent = (x.from && x.from.address || '') + ' · ' + (x.intro || ''); li.appendChild(b); li.appendChild(s); li.addEventListener('click', async () => { try { const d = await jf('/messages/' + x.id, {}, tok); $('#tm-body').textContent = d.text || '(isi kosong)'; $('#tm-body').classList.remove('hidden'); } catch (e) { Util.toast('Gagal membuka pesan'); } }); $('#tm-l').appendChild(li); });
      } catch (e) { setSt($('#tm-st'), 'Gagal memuat inbox.', '#d93a3a'); }
    }
    $('#tm-new').addEventListener('click', async () => {
      setSt($('#tm-st'), 'Membuat email...'); clearInterval(timer); $('#tm-l').innerHTML = ''; $('#tm-body').classList.add('hidden');
      try {
        const dom = (await jf('/domains'))['hydra:member'][0].domain, addr = 'tmp' + rnd(8) + '@' + dom, pw = rnd(14);
        await jf('/accounts', { method: 'POST', body: JSON.stringify({ address: addr, password: pw }) });
        tok = (await jf('/token', { method: 'POST', body: JSON.stringify({ address: addr, password: pw }) })).token;
        $('#tm-a').value = addr; setSt($('#tm-st'), 'Email siap dipakai.', '#1f8a4c'); inbox(); timer = setInterval(inbox, 10000);
      } catch (e) { tok = ''; setSt($('#tm-st'), 'Gagal membuat email. Layanan publik sedang sibuk atau diblokir, coba lagi nanti.', '#d93a3a'); }
    });
    $('#tm-rf').addEventListener('click', inbox); $('#tm-cp').addEventListener('click', () => Util.copy($('#tm-a').value));
  }
});

/* ---------- Al-Qur'an ---------- */
registerTool({
  id: 'al-quran', name: "Al-Qur'an", category: 'Info', description: 'Baca surah dan ayat dengan terjemahan Indonesia.', keywords: 'quran alquran al qur an surah ayat terjemahan baca islami mengaji',

  mount(root) {
    root.innerHTML = '<div class="grid sm:grid-cols-2 gap-3"><div><label for="qn-f" class="block text-sm font-semibold mb-2">Cari surah</label><input id="qn-f" class="field" placeholder="mis. Yasin, Al-Kahf, 36"></div><div><label for="qn-s" class="block text-sm font-semibold mb-2">Pilih surah</label><select id="qn-s" class="field"></select></div></div><p id="qn-st" class="text-sm mt-3 font-semibold" aria-live="polite"></p><div id="qn-out" class="grid gap-3 mt-3"></div><p class="muted text-xs mt-3">Sumber: API alquran.cloud (teks Utsmani dan terjemahan Indonesia). Untuk keperluan ibadah dan kutipan resmi, rujuk mushaf dan terjemahan Kemenag.</p>';
    const $ = s => Util.$(s, root), cache = {}; let list = [];
    const fill = () => { const q = $('#qn-f').value.trim().toLowerCase(); $('#qn-s').innerHTML = list.filter(s => !q || (s.number + ' ' + s.englishName + ' ' + s.name).toLowerCase().includes(q)).map(s => '<option value="' + s.number + '">' + s.number + '. ' + esc(s.englishName) + ' (' + s.numberOfAyahs + ' ayat)</option>').join(''); };
    async function load() {
      const n = $('#qn-s').value, st = $('#qn-st'); if (!n) return; setSt(st, 'Memuat surah...');
      try {
        if (!cache[n]) { const r = await fetch('https://api.alquran.cloud/v1/surah/' + n + '/editions/quran-uthmani,id.indonesian'); if (!r.ok) throw 0; cache[n] = (await r.json()).data; }

        ar.ayahs.forEach((a, i) => { const d = document.createElement('div'); d.className = 'stat'; const t = document.createElement('div'); t.dir = 'rtl'; t.style.cssText = 'font-size:1.6rem;line-height:2.4;font-family:"Traditional Arabic","Scheherazade New","Noto Naskh Arabic",serif'; t.textContent = a.text; const p = document.createElement('p'); p.className = 'text-sm mt-2'; p.textContent = a.numberInSurah + '. ' + (id.ayahs[i] ? id.ayahs[i].text : ''); d.appendChild(t); d.appendChild(p); $('#qn-out').appendChild(d); });
        setSt(st, '', '#1f8a4c');
      } catch (e) { setSt(st, 'Gagal memuat surah. Periksa koneksi internet lalu coba lagi.', '#d93a3a'); }
    }
    $('#qn-f').addEventListener('input', () => { fill(); load(); }); $('#qn-s').addEventListener('change', load);
    (async () => { setSt($('#qn-st'), 'Memuat daftar surah...'); try { const r = await fetch('https://api.alquran.cloud/v1/surah'); if (!r.ok) throw 0; list = (await r.json()).data; fill(); load(); } catch (e) { setSt($('#qn-st'), 'Gagal memuat daftar surah. Periksa koneksi internet.', '#d93a3a'); } })();
  }
});

/* =====================================================================
   LOGIN GOOGLE (Firebase Authentication) + MODE DEMO LOKAL
   Isi FIREBASE_CONFIG dari Firebase Console > Project settings > Your apps (Web).
   Jika apiKey masih kosong, aplikasi otomatis memakai login demo lokal.
   ===================================================================== */
/* Umpan balik visual tombol Salin: label berubah jadi "✓ Tersalin" sebentar */
Util.flash = function () {
  const b = Util._btn;
  if (!b || Date.now() - Util._bt > 3000 || !b.isConnected) return;
  if (!b.dataset.orig) b.dataset.orig = b.innerHTML;
  b.innerHTML = '✓ Tersalin'; b.classList.add('copied');
  clearTimeout(b._ft);
  b._ft = setTimeout(() => { b.innerHTML = b.dataset.orig; b.classList.remove('copied'); delete b.dataset.orig; }, 1500);
};
document.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { Util._btn = b; Util._bt = Date.now(); } }, true);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy-rows]'); if (!b || !b.previousElementSibling) return;
  Util.copy(Array.from(b.previousElementSibling.querySelectorAll('div.stat')).map(r => r.querySelector('dt').textContent + ': ' + r.querySelector('dd').textContent).join('\n'));
});

const FIREBASE_CONFIG = {
  apiKey: '',
  authDomain: '',
  projectId: '',
  storageBucket: '',
  messagingSenderId: '',
  appId: ''
};
const Auth = {
  user: null, favs: new Set(), fb: null, cb: null,
  key() { return 'ryntax-fav-' + (this.user ? this.user.uid : 'guest'); },
  loadFavs() { this.favs = new Set(store.get(this.key(), [])); },
  toggleFav(id) { if (this.favs.has(id)) this.favs.delete(id); else this.favs.add(id); store.set(this.key(), Array.from(this.favs)); this.render(); if (this.cb) this.cb(); },
  async init(cb) {
    this.cb = cb; document.addEventListener('click', e => { const p = Util.$('#auth-pop'); if (p && !Util.$('#auth-box').contains(e.target)) p.remove(); });
    if (FIREBASE_CONFIG.apiKey) {
      try {
        const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'), B = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
        const auth = B.getAuth(A.initializeApp(FIREBASE_CONFIG)); this.fb = { B: B, auth: auth };
        B.onAuthStateChanged(auth, u => { this.user = u ? { uid: u.uid, name: u.displayName || 'Pengguna', email: u.email || '', photo: u.photoURL || '' } : null; this.loadFavs(); this.render(); if (this.cb) this.cb(); });
        return;
      } catch (e) { this.fb = null; Util.toast('Firebase gagal dimuat, memakai mode demo'); }
    }
    this.user = store.get('ryntax-demo-user', null); this.loadFavs(); this.render(); if (this.cb) this.cb();
  },
  async signIn() {
    if (this.fb) { try { await this.fb.B.signInWithPopup(this.fb.auth, new this.fb.B.GoogleAuthProvider()); } catch (e) { Util.toast('Login gagal: ' + (e.code || 'dibatalkan')); } return; }
    this.user = { uid: 'demo', name: 'Pengguna Demo', email: 'demo@ryntax.local', photo: '' }; store.set('ryntax-demo-user', this.user); this.loadFavs(); this.render(); if (this.cb) this.cb(); Util.toast('Login demo berhasil');
  },
  async signOut() {
    if (this.fb) { try { await this.fb.B.signOut(this.fb.auth); } catch (e) { Util.toast('Logout gagal'); } return; }
    this.user = null; store.set('ryntax-demo-user', null); this.loadFavs(); this.render(); if (this.cb) this.cb();
  },
  render() {
    const box = Util.$('#auth-box'), u = this.user, logo = Util.$('#ryntax-logo').src;
    if (!u) { box.innerHTML = '<button id="auth-in" class="btn btn-primary" type="button" style="display:inline-flex;align-items:center;gap:.4rem"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#111" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3zM12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.600 0-4.800-1.800-5.600-4.100H3.100v2.600A10 10 0 0 0 12 22zM6.400 14c-.2-.6-.3-1.300-.3-2s.1-1.400.3-2V7.400H3.100a10 10 0 0 0 0 9.200zM12 5.900c1.500 0 2.800.5 3.800 1.500l2.900-2.900A10 10 0 0 0 3.100 7.400L6.400 10C7.200 7.700 9.400 5.900 12 5.900z"/></svg><span class="hidden sm:inline">Login dengan Google</span><span class="sm:hidden">Login</span></button>'; Util.$('#auth-in').addEventListener('click', () => this.signIn()); return; }
    const photo = /^https:\/\//.test(u.photo) ? u.photo : logo;
    box.innerHTML = '<button id="auth-av" class="icon-btn" type="button" aria-label="Profil" style="padding:0;overflow:hidden"><img src="' + esc(photo) + '" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover"></button>';
    Util.$('#auth-av').addEventListener('click', e => {
      e.stopPropagation(); const old = Util.$('#auth-pop'); if (old) { old.remove(); return; }
      const p = document.createElement('div'); p.id = 'auth-pop'; p.className = 'surface'; p.style.boxShadow = '5px 5px 0 var(--line)';
      p.innerHTML = '<div class="flex items-center gap-3"><img src="' + esc(photo) + '" alt="" referrerpolicy="no-referrer" style="width:3.2rem;height:3.2rem;border-radius:50%;border:2.5px solid #111;object-fit:cover"><div style="min-width:0"><b class="block truncate">' + esc(u.name) + '</b><span class="muted text-xs block truncate">' + esc(u.email) + '</span></div></div><p class="text-sm mt-3">' + (this.fb ? 'Masuk dengan Google' : '<span class="badge" style="margin:0">MODE DEMO</span>') + '</p><p class="text-sm mt-2">Tool favorit: <b>' + this.favs.size + '</b></p><button id="auth-out" class="btn mt-3" type="button" style="width:100%">Logout</button>';
      box.appendChild(p); Util.$('#auth-out').addEventListener('click', () => { p.remove(); this.signOut(); });
    });
  }
};

/* =====================================================================
   BAGIAN 3 — APLIKASI (daftar, pencarian, filter, tampilan tool, tema)
   Bagian ini tidak perlu diubah saat menambah tool baru.
   ===================================================================== */
const App = {
  category: 'All',
  query: '',

  init() {
    this.categoryLabels = { All: 'Semua' };
    Util.$('#search').addEventListener('input', e => { this.query = e.target.value.trim().toLowerCase(); this.renderList(); });
    Util.$('#back').addEventListener('click', () => { location.hash = ''; });
    Util.$('#logo').addEventListener('click', () => { Util.$('#search').value = ''; this.query = ''; this.category = 'All'; });
    Util.$('#theme-toggle').addEventListener('click', () => this.toggleTheme());
    window.addEventListener('hashchange', () => this.route());
    this.updateThemeIcon();
    Auth.init(() => { this.renderChips(); this.renderList(); });
    this.renderChips();
    this.renderList();
    this.route();
  },

  toggleTheme() {
    const dark = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('alltools-theme', dark ? 'dark' : 'light'); } catch (e) { /* abaikan */ }
    this.updateThemeIcon();
  },
  updateThemeIcon() {
    const dark = document.documentElement.classList.contains('dark');
    Util.$('#theme-toggle').innerHTML = dark
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  },

  renderChips() {
    const cats = ['All', '★ Favorit'].concat(Array.from(new Set(TOOLS.map(t => t.category))));
    const box = Util.$('#chips');
    box.innerHTML = '';
    cats.forEach(c => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (c === this.category ? ' active' : '');
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', c === this.category);
      b.textContent = c;
      b.addEventListener('click', () => { this.category = c; this.renderChips(); this.renderList(); });
      box.appendChild(b);
    });
  },

  renderList() {
    const q = this.query;
    const list = TOOLS.filter(t => {
      const inCat = this.category === 'All' || (this.category === '★ Favorit' ? Auth.favs.has(t.id) : t.category === this.category);
      const hay = (t.name + ' ' + t.description + ' ' + t.category + ' ' + (t.keywords || '')).toLowerCase();
      return inCat && (!q || q.split(/\s+/).every(w => hay.includes(w)));
    });
    const grid = Util.$('#grid');
    grid.innerHTML = '';
    const rank = t => (t.id === 'ryntax-nokos' ? -3 : 0) + ([].concat(t.badge || []).includes('DISEMATKAN') ? -2 : 0) + (Auth.favs.has(t.id) ? -1 : 0);
    list.sort((a, b) => rank(a) - rank(b));
    list.forEach(t => {
      const a = document.createElement('a');
      a.href = '#' + t.id;
      a.className = 'tool-card block c' + (TOOLS.indexOf(t) % 5);
      a.innerHTML =
        '<button type="button" class="fav" aria-label="Favoritkan ' + t.name + '">' + (Auth.favs.has(t.id) ? '★' : '☆') + '</button>' +
        '<span class="tool-icon">' + Util.icon(t.icon) + '</span>' +
        '<h3 class="font-extrabold text-base mt-3 leading-tight">' + t.name + '</h3>' +
        [].concat(t.badge || []).map(b => '<span class="badge" style="margin-right:.25rem">' + b + '</span>').join('') +
        '<p class="muted text-sm mt-1">' + t.description + '</p>' +
        '<span class="chip mt-3 inline-block" style="cursor:inherit">' + t.category + '</span>';
      a.querySelector('.fav').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); Auth.toggleFav(t.id); });
      grid.appendChild(a);
    });
    Util.$('#empty').classList.toggle('hidden', list.length > 0);
    Util.$('#tool-count').textContent = TOOLS.length + ' tools tersedia';
    Util.$('#grid-count').textContent = list.length + ' dari ' + TOOLS.length + ' tools';
  },

  route() {
    const id = decodeURIComponent(location.hash.replace(/^#/, ''));
    const tool = TOOLS.find(t => t.id === id);
    const list = Util.$('#view-list'), view = Util.$('#view-tool');
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (!tool) {
      Util.$('#tool-root').innerHTML = '';
      view.classList.add('hidden');
      list.classList.remove('hidden');
      document.title = 'All Tools – Kumpulan alat utilitas online';
      return;
    }
    list.classList.add('hidden');
    view.classList.remove('hidden');
    Util.$('#tool-icon').innerHTML = Util.icon(tool.icon);
    Util.$('#tool-title').textContent = tool.name;
    Util.$('#tool-desc').textContent = tool.description;
    const holder = Util.$('#tool-root');
    holder.innerHTML = '';
    const root = document.createElement('div');
    holder.appendChild(root);
    tool.mount(root);
    document.title = tool.name + ' – All Tools';
    window.scrollTo(0, 0);
  }
};

App.init();
